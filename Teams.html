<style>
.kzTeamButton {
    border-top: 7px solid #EDBD05;
    border-right: 7px solid #EDBD05;
    border-bottom: 7px solid #EDBD05; 
    border-left: 7px solid #EDBD05;
    border-radius: 12px 12px 12px 12px;
    background: #084D90;
    color: #EDBD05;
    display:inline-block;
    padding:20px;
    width:150px;
    font-size: 20px;
}
    .kztabel table {
        border-collapse: collapse;
        text-align: left;
        font-weight: bold;
        font-family: arial;
        font-size: 12px;
        color: #444444;
    }
    .kztabel th {
        background-color: #cccccc;
        border: 1px solid #444444;
        padding-top: 0px;
        padding-right: 2px;
        padding-bottom: 0px;
        padding-left: 2px;
    }
    .kztabel td {
        border: 1px solid #444444;
        padding-top: 0px;
        padding-right: 2px;
        padding-bottom: 0px;
        padding-left: 2px;
    }
    .kztabel td:nth-child(1) {
        text-align: right;
    }
	.kztabel img (
	    width=30px;
	}
</style>

 <script> 
 
 // For sorting in natural order
const naturalOrder = new Intl.Collator(undefined, {
	numeric: true
}).compare;   

		paramsString = window.location.search;
		searchParams = new URLSearchParams(paramsString);
		kz_team=searchParams.get('kz_team') || 28372;
		
		setTimeout(function() {
			const teams_div = document.querySelector('[id="teams_buttons_za"');
			fetch('https://data.sportlink.com/teams?client_id=3ORggLNhOq&spelsoort=za')
				.then(res => res.json()
         	.then(teamsarray => {  
            teamsarray.sort((a, b) => naturalOrder(a.teamnaam, b.teamnaam));
						for (team of teamsarray) {
							teams_div.innerHTML += `<button class="kzTeamButton" type="button" onclick="reload(${team.teamcode})">${team.teamnaam.substring(18)}</button>`;
// 							if (team.teamnaam === 'KZ/Keukensale.com 1' && !kz_team) {
// 								
// 							}
						}
					})
				);
		}, 100);
	
		
		function reload(teamcode) {
			window.location=window.location.href.split('?')[0] + '?kz_team=' + teamcode;
		} 
	</script>
	<div id="teams_buttons_za"></div>
<script> 
		paramsString = window.location.search;
		searchParams = new URLSearchParams(paramsString);
		kz_team=searchParams.get('kz_team') || 28372;
		
		setTimeout(function() {
			const programma_div = document.querySelector('[id="team_programma"');
			fetch('https://data.sportlink.com/programma?client_id=3ORggLNhOq&spelsoort=za&aantaldagen=200&teamcode=' + kz_team)
				.then(res => res.json()
					.then(programmasarray => {
						programmaHTML=`<table class="kztabel">
		<tbody>`
						for (programma of programmasarray) {
							programmaHTML += `
                            <tr>
				<td>${programma.datum}</td>
                <td>${programma.aanvangstijd}</td>
                <td><img src= "${programma.thuisteamlogo}"width="30" height="30"></td>
                <td>${programma.thuisteam+" -  "+programma.uitteam}</td>
                <td><img src= "${programma.uitteamlogo}"width="30" height="30"></td>
				</tr>
            `;
						}
						programmaHTML+=`</tbody>
	</table>`;
                    programma_div.innerHTML = programmaHTML;
					})
				);
		}, 100);
	</script>
	<div  id="team_programma" style="float:left"/>
