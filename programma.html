<script> 
    paramsString = window.location.search;
    searchParams = new URLSearchParams(paramsString);
    kz_team=searchParams.get('kz_team') || 28372;
    
    setTimeout(function() {
        const programma_div = document.querySelector('[id="team_programma"');
        fetch('https://data.sportlink.com/programma?client_id=xxx&spelsoort=za&teamcode=' + kz_team)
            .then(res => res.json()
                .then(programmasarray => {
                    programmaHTML=`<table class="kzProgramma"><tbody>`
                    for (programma of programmasarray) {
                        programmaHTML += `<tr><td>${programma.thuisteam}</td><td>${programma.uitteam}</td><td>${programma.wedstrijddatum}</td></tr>`;
                    }
                    programmaHTML+=`</tbody></table>`
                    programma_div.innerHTML = programmaHTML;
                })
            );
    }, 100);
</script>

<div id="team_programma"></div>
